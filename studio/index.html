<!doctype html>
<html data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' msk: data: blob:; media-src 'self' msk: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'" />
  <title>MSK Studio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="lg" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="9" result="n" />
      <feGaussianBlur in="n" stdDeviation="2.5" result="nb" />
      <feDisplacementMap in="SourceGraphic" in2="nb" scale="34" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div class="ambient" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i><div class="grain"></div></div>

  <header class="titlebar">
    <div class="brand"><span class="wm" id="wm-small"></span><span class="brand-name">MSK</span></div>
    <div class="tb-center"><div class="pill glass" id="tv-pill"><span class="dot"></span><span id="tv-text">TradingView closed</span></div>
      <button class="pill upd-pill" id="upd-pill" hidden title="Update available"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg><span id="upd-text">Update</span></button>
      <button class="pill glass pal-btn" id="pal-btn" title="Command palette"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Search</span><kbd>Ctrl K</kbd></button></div>
    <div class="tb-right">
      <button class="wc" id="theme-btn" title="Light / dark"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
      <button class="wc" id="w-min" title="Minimize"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="wc" id="w-max" title="Maximize"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
      <button class="wc close" id="w-close" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </header>

  <aside class="sidebar glass">
    <nav id="nav">
      <span class="nav-blob"></span>
      <button data-page="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
      <button data-page="library"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Library</span></button>
      <button data-page="editor"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Editor</span></button>
      <button data-page="configs"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg><span>Configs</span></button>
      <button data-page="logs"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M13 15h4"/></svg><span>Logs</span></button>
      <button data-page="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></button>
    </nav>
    <div class="side-foot">
      <div class="np" id="np" title="Open in Editor"><span class="np-thumb"></span><div class="np-txt"><small class="eyebrow" style="font-size:9px">Now playing</small><b class="np-name">-</b><small class="np-sub"></small></div>
        <button class="np-next" id="np-next" title="Next config"><svg viewBox="0 0 24 24"><path d="M5 5l9 7-9 7zM18 5v14"/></svg></button></div>
      <div class="master">
        <div><b>Background</b><small id="master-sub">On</small></div>
        <label class="switch big"><input type="checkbox" id="master" /><span></span></label>
      </div>
    </div>
  </aside>

  <main id="view"></main>
  <div id="toasts"></div>
  <div id="modal-root"></div>
  <div id="drop" class="drop"><div class="drop-inner glass"><b>Drop to add</b><small>Images and videos go straight to your library</small></div></div>

  <script src="../common.js"></script>
  <script src="shim.js"></script>
  <script src="logo.js"></script>
  <script src="fx.js"></script>
  <script src="chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
